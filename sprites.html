<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Index | XPLUZO's index</title>
    <style>
        :root {
            --green: #39ff88;
            --card: rgba(10,30,18,.75);
            --border: rgba(57,255,136,.15);
            --white: #f2fff6;
            --muted: #91a69a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Inter, sans-serif;
            background: #030806;
            color: var(--white);
            min-height: 100vh;
            padding: 40px 20px;
            transition: background-color .4s ease, color .4s ease;
        }

        .back {
            text-decoration: none;
            color: black;
            background: var(--green);
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 12px 15px;
            border: none;
            border-radius: 12px;
            background: var(--card);
            color: white;
            font: inherit;
        }

        .controls button {
            background: var(--green);
            color: black;
            font-weight: 700;
            cursor: pointer;
        }

        .stats {
            max-width: 900px;
            margin: auto;
            margin-bottom: 25px;
        }

        .progress-track {
            width: 100%;
            height: 18px;
            border-radius: 999px;
            overflow: hidden;
            background: #111;
        }

        .progress-fill, .mastered-fill {
            height: 100%;
            width: 0%;
            transition: .3s;
        }

        .progress-fill {
            background: linear-gradient(90deg, #39ff88, #a5ff7c);
        }

        .mastered-fill {
            background: linear-gradient(90deg, #ffd700, #ff9900);
        }

        .percent {
            margin-bottom: 10px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            transition: .25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--green);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #111;
        }

        .content {
            padding: 15px;
        }

        .name {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        .check input { transform: scale(1.15); }
        .crown { color: gold; }

        @media (max-width: 1400px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
</head>
<body>
    <a href="index.html" class="back">⬅ Back To Home</a>
    <h1>✨ Sprite Index ✨</h1>
    <h1>✨ made by XPLUZOyt please subscribe ✨</h1>

    <div class="controls">
        <input type="text" id="search" placeholder="Search Sprite">
        <select id="filter">
            <option value="all">All</option>
            <option value="owned">Owned</option>
            <option value="missing">Missing</option>
        </select>
        <button onclick="exportSpriteSheet('missing')">❌ Missing</button>
        <button onclick="exportSpriteSheet('collected')">✅ Collected</button>
        <button onclick="exportSpriteSheet('nonmastered')">📦 Non-Mastered</button>
        <button onclick="exportSpriteSheet('mastered')">👑 Mastered</button>
    </div>

    <div class="stats">
        <div id="statsText" class="percent">📦 Collection 0/0 (0%)</div>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div id="masteredText" class="percent">👑 Mastered 0/0 (0%)</div>
        <div class="progress-track"><div id="masteredFill" class="mastered-fill"></div></div>
    </div>

    <div id="grid" class="grid"></div>

    <script src="account-widget.js" defer></script>
    <script>
        const spriteBases = ["Halfpeel'd", "Re-Pete", "Barry O'Fish", "Chester", "Exmarks", "Wayfinder", "Kelper", "Lil' Squibbly", "Lil' Flacko", "Lil' Uzi Vert Jr.", "Plundarrgh", "Squiplash", "Mini Miku"];
        const variants = [{ prefix: "", variant: "Base" }, { prefix: "Fortune", variant: "For" }, { prefix: "Cursed", variant: "Cur" }];

        let spriteId = 1;
        const defaultSprites = [];

        spriteBases.forEach(base => {
            variants.forEach(v => {
                const imageName = `${v.prefix ? v.prefix.toLowerCase() + '-' : ''}${base.toLowerCase().replace(/'/g, '').replace(/\./g, '').replace(/\s+/g, '-')}.png`;
                defaultSprites.push({ id: spriteId++, name: v.prefix ? `${v.prefix} ${base}` : base, variant: v.variant, image: `images/${imageName}` });
            });
        });

        defaultSprites.push({ id: spriteId++, name: "Transponder Snail", variant: "Base", image: "images/transponder-snail-base.png" });
        defaultSprites.push({ id: spriteId++, name: "Sweet Dreams", variant: "Base", image: "images/sweet-dreams-base.png" });
        defaultSprites.push({ id: spriteId++, name: "Zee", variant: "Base", image: "images/zee.png" });

        let sprites = [];
        try {
            sprites = JSON.parse(localStorage.getItem("spriteCollection")) || [];
        } catch {
            sprites = [];
        }

        if (!sprites || sprites.length < defaultSprites.length) {
            sprites = defaultSprites.map(sprite => ({ ...sprite, owned: false, mastered: false }));
            localStorage.setItem("spriteCollection", JSON.stringify(sprites));
        }

        function saveSprites() {
            localStorage.setItem("spriteCollection", JSON.stringify(sprites));
        }

        const grid = document.getElementById("grid");
        const statsText = document.getElementById("statsText");
        const progressFill = document.getElementById("progressFill");
        const masteredText = document.getElementById("masteredText");
        const masteredFill = document.getElementById("masteredFill");

        function updateStats() {
            const owned = sprites.filter(s => s.owned).length;
            const mastered = sprites.filter(s => s.mastered).length;
            const total = sprites.length;
            const ownedPercent = total > 0 ? Math.round((owned / total) * 100) : 0;
            const masteredPercent = total > 0 ? Math.round((mastered / total) * 100) : 0;

            statsText.textContent = `📦 Collection ${owned}/${total} (${ownedPercent}%)`;
            progressFill.style.width = ownedPercent + "%";
            masteredText.textContent = `👑 Mastered ${mastered}/${total} (${masteredPercent}%)`;
            masteredFill.style.width = masteredPercent + "%";
        }

        function render() {
            const search = document.getElementById("search").value.toLowerCase();
            const filter = document.getElementById("filter").value;

            grid.innerHTML = "";
            sprites.filter(sprite => {
                const matchesSearch = sprite.name.toLowerCase().includes(search);
                if (filter === "owned") return matchesSearch && sprite.owned;
                if (filter === "missing") return matchesSearch && !sprite.owned;
                return matchesSearch;
            }).forEach(sprite => {
                const card = document.createElement("div");
                card.className = "card";
                const borders = { Base: "#ffd700", Gold: "#ffd700", Cheat: "#2fff45", Hacker: "#e448ff", Hunter: "#39ff88", Trick: "#ff9c2b", Quack: "#b784ff" };
                card.style.border = `2px solid ${borders[sprite.variant] || "#444"}`;
                card.innerHTML = `
                    <img src="${sprite.image}" alt="${sprite.name}">
                    <div class="content">
                        <div class="name">${sprite.name}</div>
                        <div style="color:#39ff88; font-size:.8rem; margin-bottom:10px; font-weight:700;">${sprite.variant}</div>
                        <label class="check"><input type="checkbox" ${sprite.owned ? "checked" : ""} onchange="toggleOwned(${sprite.id})"> ✅ Owned</label>
                        <label class="check"><input type="checkbox" ${sprite.mastered ? "checked" : ""} onchange="toggleMastered(${sprite.id})"><span class="crown">👑</span> Mastered</label>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateStats();
        }

        function toggleOwned(id) {
            const sprite = sprites.find(s => s.id === id);
            sprite.owned = !sprite.owned;
            if (!sprite.owned) sprite.mastered = false;
            saveSprites();
            render();
        }

        function toggleMastered(id) {
            const sprite = sprites.find(s => s.id === id);
            if (!sprite.owned) {
                alert("You must own a sprite before mastering it.");
                return;
            }
            sprite.mastered = !sprite.mastered;
            saveSprites();
            render();
        }

        document.getElementById("search").addEventListener("input", render);
        document.getElementById("filter").addEventListener("change", render);
        render();
    </script>
</body>
</html>
