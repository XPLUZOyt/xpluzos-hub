async function exportSpriteSheet(type){

    let filteredSprites = [];
    let title = "";
    let fileName = "";

    switch(type){

        case "missing":
            filteredSprites =
            sprites.filter(s => !s.owned);
            title = "Missing";
            fileName = "missing-sprites.png";
            break;

        case "collected":
            filteredSprites =
            sprites.filter(s => s.owned);
            title = "Collected";
            fileName = "collected-sprites.png";
            break;

        case "nonmastered":
    filteredSprites =
    sprites.filter(
        s => s.owned && !s.mastered);
            title = "Non-Mastered";
            fileName = "non-mastered-sprites.png";
            break;

        case "mastered":
            filteredSprites =
            sprites.filter(s => s.mastered);
            title = "Mastered";
            fileName = "mastered-sprites.png";
            break;
    }

    if(filteredSprites.length === 0){
        alert("No sprites found.");
        return;
    }

const columns = 14;
const cardWidth = 120;
const cardHeight = 140;
const padding = 8;
const headerHeight = 120;

    const rows =
    Math.ceil(filteredSprites.length / columns);

    const canvas =
    document.createElement("canvas");

canvas.width =
(columns * cardWidth) +
((columns + 1) * padding);

canvas.height =
headerHeight +
(rows * cardHeight) +
((rows + 1) * padding);

    const ctx =
    canvas.getContext("2d");

const bgGradient =
ctx.createLinearGradient(
    0,
    0,
    canvas.width,
    canvas.height
);

bgGradient.addColorStop(
0,
"#181a2c"
);

bgGradient.addColorStop(
1,
"#0c1218"
);

ctx.fillStyle =
bgGradient;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.textAlign = "center";

ctx.fillStyle =
"#ffffff";

ctx.font =
"bold 50px Arial";

ctx.fillText(
title.toUpperCase(),
canvas.width / 2,
55
);

ctx.fillStyle =
"#39ff88";

ctx.font =
"bold 24px Arial";

ctx.fillText(
`${filteredSprites.length} SPRITES`,
canvas.width / 2,
95
);

    const imagePromises =
    filteredSprites.map(sprite => {

        return new Promise(resolve => {

            const img = new Image();
            img.crossOrigin = "anonymous";

            img.onload = () =>
            resolve({sprite,img});

            img.onerror = () =>
            resolve(null);

            img.src = sprite.image;

        });

    });

    const images =
    await Promise.all(imagePromises);

    images.forEach((entry,index)=>{

        if(!entry) return;

        const col =
        index % columns;

        const row =
        Math.floor(index / columns);

const x =
padding +
col * (cardWidth + padding);

const y =
headerHeight +
row * (cardHeight + padding);

       const rarityColors = {
    Base:"#403b1d",
    Gold:"#6f5600",
    Cheat:"#245c11",
    Hacker:"#3f1761",
    Hunter:"#17324b",
    Trick:"#6b3300",
    Quack:"#4f2b7a"
};

ctx.fillStyle =
rarityColors[
entry.sprite.variant
] || "#222";

ctx.fillRect(
x,
y,
cardWidth,
cardHeight
);

ctx.strokeStyle =
"#ffd700";

ctx.lineWidth = 2;

ctx.strokeRect(
x,
y,
cardWidth,
cardHeight
);

ctx.drawImage(
entry.img,
x + 10,
y + 8,
100,
100
);

ctx.fillStyle =
"#fff";

ctx.font =
"bold 10px Arial";

let label =
entry.sprite.name;

if(label.length > 16){
    label =
    label.substring(0,14)
    + "..";
}

ctx.fillText(
label,
x + cardWidth / 2,
y + 125
);
    });

    const link =
    document.createElement("a");

    link.download =
    fileName;

    link.href =
    canvas.toDataURL("image/png");

    link.click();
}

render();

</script>

</body>
</html>
