<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Tracker</title>
  <style>
    :root {
      --background: #030806;
      --background-2: #07130c;
      --card: rgba(10, 30, 18, 0.72);
      --green: #39ff88;
      --white: #f2fff6;
      --muted: #91a69a;
      --border: rgba(57, 255, 136, 0.15);
      --border-hover: rgba(57, 255, 136, 0.5);
      --yellow: #f7d778;
      --status-text: #dfe7e3;
      --danger-soft: rgba(255, 90, 90, 0.18);
    }

    * { box-sizing: border-box; margin:0; padding:0; font-family: "Segoe UI", sans-serif; }
    body {
      min-height:100vh;
      background: radial-gradient(circle at 15% 10%, rgba(57,255,136,.09), transparent 30%), radial-gradient(circle at 85% 50%, rgba(19,184,92,.08), transparent 30%), linear-gradient(180deg, var(--background), var(--background-2));
      color: var(--white);
      line-height:1.4;
    }
    .container { max-width:1500px; margin:0 auto; padding:22px 18px 40px; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; }
    .site-credit { color: var(--green); font-weight:700; }
    .home-button { display:inline-block; padding:10px 16px; border:1px solid var(--border-hover); border-radius:10px; background: rgba(57,255,136,.1); color: var(--white); font-weight:700; text-decoration:none; transition: background .2s, border-color .2s; }
    .home-button:hover, .home-button:focus-visible { background: rgba(57,255,136,.2); border-color: var(--green); }
    .card { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(15px); border-radius:18px; padding:20px; transition:.3s; }
    .card:hover { border-color: var(--border-hover); }
    .next-hour { display:flex; gap:20px; align-items:center; }
    .logo { width:120px; height:120px; border-radius:16px; object-fit:cover; }
    .badge { display:inline-block; background: rgba(75,67,19,0.9); color:var(--yellow); padding:6px 12px; border-radius:8px; font-weight:700; margin-bottom:10px; letter-spacing:.12em; text-transform:uppercase; font-size:.68rem; }
    .countdown { font-size: clamp(2rem, 4vw, 4rem); font-weight:900; margin:10px 0; text-shadow:0 0 20px rgba(57,255,136,0.2); letter-spacing:.02em; }
    .subtitle, .section-desc { color: var(--muted); }
    .section-title { font-size:1.8rem; margin-bottom:5px; }
    .section-desc { margin-bottom:20px; }
    .schedule-grid { display:grid; grid-template-columns: minmax(0,1.15fr) minmax(0,.85fr); align-items:start; gap:20px; margin-top:22px; }
    .event-list { display:flex; flex-direction:column; max-height:450px; overflow-y:auto; }
    .event { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 16px; border-top:1px solid var(--border); background:rgba(0,0,0,0.08); }
    .event:first-child { border-top:0; padding-top:0; }
    .event-main { flex:1; min-width:0; }
    .event-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
    .event-date { font-weight:700; font-size:1.05rem; letter-spacing:.02em; }
    .event-offer { font-size:1.02rem; letter-spacing:.01em; }
    .multiplier { color:var(--green); font-weight:800; }
    .event-badges { display:flex; align-items:center; justify-content:flex-end; min-width:175px; }
    .status { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.05); color:var(--status-text); padding:7px 12px; border-radius:9px; font-weight:800; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; text-align:center; line-height:1; min-width:120px; }
    .status.is-next { background: rgba(247,215,120,0.12); color: var(--yellow); border-color: rgba(247,215,120,0.3); }
    .status.is-ended { background: var(--danger-soft); }
    @media (max-width: 900px) { .schedule-grid { grid-template-columns:1fr; } .next-hour { flex-direction:column; align-items:flex-start; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="site-credit">Xpluzo's Hub</div>
      <a class="home-button" href="index.html">← Home</a>
    </div>

    <div class="card next-hour">
      <img class="logo" src="images/treasure-icon.png" alt="Treasure Event Icon">
      <div>
        <span class="badge">Next Hour</span>
        <div class="countdown" id="countdown">--:--:--</div>
        <div class="subtitle" id="next-event-label">Loading event…</div>
      </div>
    </div>

    <div class="schedule-grid">
      <section class="card">
        <h2 class="section-title">Upcoming Event Schedule</h2>
        <p class="section-desc">See the next active and upcoming offers across the hub.</p>
        <div id="event-list" class="event-list"></div>
      </section>

      <aside class="card">
        <h2 class="section-title">Event Notes</h2>
        <p class="section-desc">Use the tracker to keep an eye on the next active window and upcoming rewards.</p>
      </aside>
    </div>
  </div>

  <script src="account-widget.js" defer></script>
  <script>
    const events = [
      { date: 'Today', offer: 'Treasure Rush', multiplier: '2x', status: 'next' },
      { date: 'Tomorrow', offer: 'Bonus Loot', multiplier: '1.5x', status: 'upcoming' },
      { date: 'Friday', offer: 'Rare Drop Surge', multiplier: '3x', status: 'upcoming' }
    ];

    function renderEvents() {
      const list = document.getElementById('event-list');
      list.innerHTML = events.map(event => `
        <div class="event">
          <div class="event-main">
            <div class="event-header">
              <div class="event-date">${event.date}</div>
            </div>
            <div class="event-offer">${event.offer} <span class="multiplier">${event.multiplier}</span></div>
          </div>
          <div class="event-badges">
            <div class="status ${event.status === 'next' ? 'is-next' : event.status === 'ended' ? 'is-ended' : ''}">${event.status === 'next' ? 'Live' : event.status === 'ended' ? 'Ended' : 'Scheduled'}</div>
          </div>
        </div>
      `).join('');
    }

    function updateCountdown() {
      const target = new Date();
      target.setHours(target.getHours() + 1, 0, 0, 0);
      const now = new Date();
      const diff = Math.max(0, target - now);
      const hours = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const minutes = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const seconds = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      document.getElementById('countdown').textContent = `${hours}:${minutes}:${seconds}`;
      document.getElementById('next-event-label').textContent = 'Treasure Rush • 2x multiplier active for the next hour';
    }

    renderEvents();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
